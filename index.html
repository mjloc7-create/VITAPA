<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Post New Service</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f3f4f6; padding: 20px;">

    <div style="max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h2 style="color: #1f2937; margin-bottom: 20px;">Admin Dashboard: Post New Service</h2>

        <!-- Service Name & Price Inputs (Keeping your existing IDs) -->
        <div style="margin-bottom: 15px;">
            <input type="text" id="job-title" placeholder="Service Name (e.g., Event Security / Dance Fitness)" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 15px;">
            <input type="text" id="job-price" placeholder="Price in INR (e.g., ₹500)" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
        </div>

        <!-- WORK DATE -->
        <div style="margin-bottom: 15px;">
            <label style="font-size: 12px; font-weight: bold; color: #1a56db; display: block; margin-bottom: 5px;">📅 WORK DATE</label>
            <input type="date" id="work-date" value="2026-09-29" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
        </div>

        <!-- SIDE-BY-SIDE: REPORTING TIME & DISBURSAL TIME -->
        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label style="font-size: 12px; font-weight: bold; color: #1a56db; display: block; margin-bottom: 5px;">🟢 REPORTING TIME</label>
                <input type="time" id="reporting-time" value="09:00" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
            </div>
            <div style="flex: 1;">
                <label style="font-size: 12px; font-weight: bold; color: #dc2626; display: block; margin-bottom: 5px;">🔴 DISBURSAL TIME</label>
                <input type="time" id="disbursal-time" value="18:00" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
            </div>
        </div>

        <!-- CHOOSE LOCATION SETTING METHOD (High Accuracy Geolocation) -->
        <div style="margin-bottom: 20px;">
            <label style="font-size: 12px; font-weight: bold; color: #dc2626; display: block; margin-bottom: 5px;">📍 CHOOSE LOCATION SETTING METHOD (200M GEOFENCE)</label>
            <input type="text" id="location-address" placeholder="Fetching precise location..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; box-sizing: border-box;">
            
            <div style="display: flex; gap: 10px;">
                <button type="button" onclick="dragAndSetMap()" style="flex: 1; background: #d97706; color: white; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">🗺️ Drag and Set on Map</button>
                <button type="button" onclick="getPreciseCurrentLocation()" style="flex: 1; background: #059669; color: white; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">📌 Pin Current Location</button>
            </div>
        </div>

        <!-- BROADCAST BUTTON -->
        <button type="button" onclick="broadcastJob()" style="width: 100%; background: #059669; color: white; padding: 12px; border: none; border-radius: 5px; font-weight: bold; font-size: 14px; cursor: pointer;">Broadcast Job Live with Reporting & Disbursal Times</button>
    </div>

    <script>
        // High-accuracy GPS capture script
        function getPreciseCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = position.coords.accuracy; // in meters
                        
                        document.getElementById('location-address').value = Lat: \, Lon: \ (Accurate to \m);
                        alert(Precise location captured successfully! (Accuracy: \ meters));
                    },
                    (error) => {
                        alert('Error capturing location. Please ensure GPS/Location permissions are enabled.');
                    },
                    {
                        enableHighAccuracy: true, // Forces GPS chip usage for high precision
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                alert('Geolocation is not supported by your browser.');
            }
        }

        function dragAndSetMap() {
            alert('Map drag feature activated.');
        }

        function broadcastJob() {
            const title = document.getElementById('job-title').value;
            const price = document.getElementById('job-price').value;
            if (title && price) {
                document.getElementById('job-title').value = '';
                document.getElementById('job-price').value = '';
                alert('Job broadcasted live with Attendance & Closing QR codes!');
            } else {
                alert('Please fill in service name and price.');
            }
        }
    </script>
</body>
</html>
