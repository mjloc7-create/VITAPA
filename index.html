<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITAPA - Hyper-Local Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">VITAPA <span class="text-xs bg-indigo-500 py-1 px-2 rounded-full uppercase">Admin & Marketplace</span></h1>
            <div id="user-role-badge" class="text-xs bg-indigo-700 px-3 py-1 rounded-full font-medium">Marketplace View</div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- Admin Login / Switch Section -->
        <div id="admin-auth-section" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
            <h2 class="text-lg font-semibold mb-3 text-slate-700">Admin Portal Access</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="email" id="admin-email" placeholder="Admin Email" class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <input type="password" id="admin-password" placeholder="Password" class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button onclick="handleAdminLogin()" class="mt-4 w-full md:w-auto bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-indigo-700 transition">Log in to Post Bookings</button>
        </div>

        <!-- Admin Dashboard (Hidden by default) -->
        <div id="admin-dashboard" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-700">Post New Service / Costume Job</h2>
                    <button onclick="handleAdminLogout()" class="text-sm text-red-600 hover:underline">Log Out</button>
                </div>
                <div class="space-y-4">
                    <input type="text" id="job-title" placeholder="Service Name (e.g., Costume Fitting & Rental)" class="w-full px-4 py-2 border rounded-lg">
                    <input type="text" id="job-price" placeholder="Price in INR (e.g., ₹500)" class="w-full px-4 py-2 border rounded-lg">
                    <button onclick="postJob()" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-medium hover:bg-emerald-700 transition">Broadcast Job (1.0 km Radius)</button>
                </div>
            </div>

            <!-- Live Incoming Bookings Tracker for Admin -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold text-slate-700 mb-3">Live Accepted Bookings Tracker</h2>
                <div id="admin-bookings-list" class="space-y-3">
                    <p class="text-sm text-slate-400 italic">No bookings accepted yet. Waiting for client actions...</p>
                </div>
            </div>
        </div>

        <!-- Marketplace Feed (For Clients / Tablets) -->
        <div id="marketplace-section">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-800">Nearby Services (Within 1.0 km)</h2>
                <span id="gps-status" class="text-xs text-amber-600 bg-amber-50 px-2 py-1 rounded">Locating via GPS...</span>
            </div>
            <div id="listings-feed" class="space-y-4">
                <!-- Dynamic items will load here -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        VITAPA Hyper-Local Platform &bull; Secure PWA
    </footer>

    <!-- Audio Alert Element -->
    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        let activeJobs = JSON.parse(localStorage.getItem('vitapa_jobs')) || [
            { id: 1, title: 'COSTUME FOLDING WORK', price: '₹50', location: 'AITUR LAYOUT - 54m away', status: 'Available' }
        ];

        let acceptedBookings = JSON.parse(localStorage.getItem('vitapa_bookings')) || [];

        function renderApp() {
            const feed = document.getElementById('listings-feed');
            feed.innerHTML = '';

            if (activeJobs.length === 0) {
                feed.innerHTML = '<p class="text-slate-500 text-sm">No active listings within your radius.</p>';
                return;
            }

            activeJobs.forEach(job => {
                const item = document.createElement('div');
                item.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center';
                item.innerHTML = `
                    <div>
                        <p class="text-xs text-indigo-600 font-semibold uppercase">COSTUME</p>
                        <h3 class="font-bold text-slate-800">${job.title}</h3>
                        <p class="text-xs text-slate-500">${job.location}</p>
                    </div>
                    <div class="text-right">
                        <span class="block font-bold text-slate-900 mb-2">${job.price}</span>
                        ${job.status === 'Available' ? 
                            `<button onclick="takeBooking(${job.id})" class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">Take Booking</button>` :
                            `<span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded font-medium">Booked</span>`
                        }
                    </div>
                `;
                feed.appendChild(item);
            });

            const adminList = document.getElementById('admin-bookings-list');
            if (adminList) {
                if (acceptedBookings.length === 0) {
                    adminList.innerHTML = '<p class="text-sm text-slate-400 italic">No bookings accepted yet. Waiting for client actions...</p>';
                } else {
                    adminList.innerHTML = '';
                    acceptedBookings.forEach(b => {
                        const bItem = document.createElement('div');
                        bItem.className = 'p-3 bg-emerald-50 border border-emerald-200 rounded-lg flex justify-between items-center text-sm';
                        bItem.innerHTML = `
                            <div><strong>${b.title}</strong> (${b.price}) booked by <strong>${b.client}</strong></div>
                            <span class="text-xs text-emerald-700 font-semibold">${b.time}</span>
                        `;
                        adminList.appendChild(bItem);
                    });
                }
            }
        }

        function takeBooking(id) {
            const job = activeJobs.find(j => j.id === id);
            if (job) {
                const clientName = prompt("Enter your name to confirm booking:", "Client");
                if (!clientName) return; // cancelled

                job.status = 'Booked';
                
                const newBooking = {
                    title: job.title,
                    price: job.price,
                    client: clientName,
                    time: new Date().toLocaleTimeString()
                };
                acceptedBookings.unshift(newBooking);

                localStorage.setItem('vitapa_jobs', JSON.stringify(activeJobs));
                localStorage.setItem('vitapa_bookings', JSON.stringify(acceptedBookings));

                renderApp();

                alert("Booking accepted successfully! Admin has been notified.");
            }
        }

        function handleAdminLogin() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-password').value;
            if (email && pass) {
                document.getElementById('admin-auth-section').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                document.getElementById('user-role-badge').innerText = 'Admin Mode Active';
                renderApp();
            } else {
                alert('Please enter admin credentials.');
            }
        }

        function handleAdminLogout() {
            document.getElementById('admin-auth-section').classList.remove('hidden');
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('user-role-badge').innerText = 'Marketplace View';
        }

        function postJob() {
            const title = document.getElementById('job-title').value;
            const price = document.getElementById('job-price').value;
            if(title && price) {
                const newJob = {
                    id: Date.now(),
                    title: title.toUpperCase(),
                    price: price.startsWith('₹') ? price : '₹' + price,
                    location: 'AITUR LAYOUT - 12m away',
                    status: 'Available'
                };
                activeJobs.push(newJob);
                localStorage.setItem('vitapa_jobs', JSON.stringify(activeJobs));
                document.getElementById('job-title').value = '';
                document.getElementById('job-price').value = '';
                renderApp();
                alert('Job broadcasted successfully to nearby devices!');
            } else {
                alert('Please fill in both title and price.');
            }
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'vitapa_bookings') {
                acceptedBookings = JSON.parse(e.newValue) || [];
                const sound = document.getElementById('alert-sound');
                if (sound) {
                    sound.play().catch(err => console.log('Audio autoplay blocked until interaction'));
                }
                renderApp();
            }
            if (e.key === 'vitapa_jobs') {
                activeJobs = JSON.parse(e.newValue) || [];
                renderApp();
            }
        });

        setTimeout(() => {
            document.getElementById('gps-status').innerText = 'GPS Locked (1.0 km)';
            document.getElementById('gps-status').className = 'text-xs text-emerald-600 bg-emerald-50 px-2 py-1 rounded font-medium';
        }, 1000);

        renderApp();
    </script>
</body>
</html>
