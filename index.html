<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITAPA - Secure Attendance & Portal Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-950 text-slate-100 font-sans p-4 flex items-center justify-center min-h-screen">
    <div id="app-container" class="max-w-md w-full space-y-4">
        <!-- Role Selection / Login View -->
        <div class="bg-indigo-900 border border-indigo-700 p-8 rounded-2xl text-center space-y-6 shadow-2xl">
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">VITAPA</h1>
                <p class="text-xs text-indigo-300 mt-1">Hyper-Local Marketplace & Secure Attendance</p>
            </div>
            
            <div class="space-y-3 pt-2">
                <p class="text-xs font-semibold text-slate-200 uppercase tracking-wider">Select Portal Role</p>
                <button onclick="selectRole('worker')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white p-3 rounded-xl shadow transition flex items-center justify-center gap-2">
                    <span>👷 Worker Portal</span>
                </button>
                <button onclick="selectRole('admin')" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-200 p-3 rounded-xl shadow transition flex items-center justify-center gap-2">
                    <span>🛡️ Admin Dashboard</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Check initial persistent role if stored
        document.addEventListener('DOMContentLoaded', () => {
            const savedRole = localStorage.getItem('vitapa_role');
            if (savedRole === 'worker') loadWorkerPortal();
            else if (savedRole === 'admin') loadAdminPortal();
        });

        function selectRole(role) {
            localStorage.setItem('vitapa_role', role);
            if (role === 'worker') loadWorkerPortal();
            else loadAdminPortal();
        }

        function loadWorkerPortal() {
            document.getElementById('app-container').className = "max-w-4xl mx-auto space-y-4 w-full";
            document.getElementById('app-container').innerHTML = `
                <header class="flex justify-between items-center bg-indigo-900 p-4 rounded-xl border border-indigo-700">
                    <h1 class="text-sm font-bold text-white">VITAPA <span class="text-[10px] bg-indigo-600 px-2 py-0.5 rounded">Worker Portal Active</span></h1>
                    <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded font-semibold border border-slate-700 text-slate-200 transition">Switch Role / Login</button>
                </header>

                <div class="bg-indigo-900/60 border border-indigo-800 p-5 rounded-2xl space-y-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 class="text-sm font-semibold text-indigo-200">LOGGED IN: <span class="text-white font-bold">sharath</span></h2>
                            <p class="text-xs text-indigo-300 mt-1">Step 1: Verify 200m GPS. Step 2: Scan Attendance QR. Step 3: Scan Closing QR after shift completion.</p>
                        </div>
                        <div class="flex gap-2 items-center">
                            <button onclick="switchView('portal')" id="tab-portal-btn" class="text-xs bg-indigo-600 px-3 py-1.5 rounded font-bold shadow">Portal</button>
                            <button onclick="switchView('earnings')" id="tab-earnings-btn" class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded font-bold border border-slate-700">💰 Earnings</button>
                            <button onclick="handleLogout()" type="button" class="text-xs bg-rose-600/80 hover:bg-rose-600 px-3 py-1.5 rounded font-bold text-white transition cursor-pointer">Log Out</button>
                        </div>
                    </div>

                    <div id="portal-view" class="space-y-4 pt-2">
                        <div class="bg-indigo-950 p-4 rounded-xl border border-indigo-800">
                            <p class="text-xs font-semibold text-amber-400 mb-2">📍 GEOFENCE & SHIFT STATUS: <span class="bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded text-[10px]">GPS Not Verified</span></p>
                            <div class="grid grid-cols-3 gap-2">
                                <button class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold p-3 rounded-lg text-center">1. Verify 200m Arrival GPS</button>
                                <button class="bg-slate-800 text-slate-400 text-xs font-bold p-3 rounded-lg text-center border border-slate-700">2. Scan Attendance QR</button>
                                <button class="bg-slate-800 text-slate-400 text-xs font-bold p-3 rounded-lg text-center border border-slate-700">3. Scan Closing QR</button>
                            </div>
                        </div>
                        <div class="bg-indigo-950 p-4 rounded-xl border border-indigo-800 space-y-3">
                            <h3 class="font-bold text-slate-200 text-sm">Available Shifts & Live Feed</h3>
                            <div id="worker-available-jobs" class="space-y-2">
                                <p class="text-xs text-slate-400 italic">Loading posted jobs from admin...</p>
                            </div>
                        </div>
                    </div>

                    <div id="earnings-view" class="hidden space-y-4 pt-2">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-indigo-950 p-4 rounded-xl border border-indigo-800">
                                <p class="text-xs text-indigo-300 uppercase font-semibold">Total Lifetime Earnings</p>
                                <h3 id="total-earnings-display" class="text-2xl font-bold text-emerald-400 mt-1">₹0</h3>
                            </div>
                            <div class="bg-indigo-950 p-4 rounded-xl border border-indigo-800">
                                <p class="text-xs text-indigo-300 uppercase font-semibold">Completed Shifts</p>
                                <h3 id="total-completed-shifts" class="text-2xl font-bold text-indigo-400 mt-1">0</h3>
                            </div>
                        </div>
                        <div class="bg-indigo-950 p-4 rounded-xl border border-indigo-800 space-y-3">
                            <h3 class="font-bold text-slate-200 text-sm">Payout & Shift History</h3>
                            <div id="earnings-history-list" class="space-y-2">
                                <p class="text-xs text-slate-400 italic">No completed shifts recorded yet.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            renderWorkerJobsFeed();
        }

        function loadAdminPortal() {
            document.getElementById('app-container').className = "max-w-4xl mx-auto space-y-4 w-full";
            document.getElementById('app-container').innerHTML = `
                <header class="flex justify-between items-center bg-indigo-900 p-4 rounded-xl border border-indigo-700">
                    <h1 class="text-sm font-bold text-white">VITAPA <span class="text-[10px] bg-rose-600 px-2 py-0.5 rounded">Admin Dashboard Active</span></h1>
                    <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded font-semibold border border-slate-700 text-slate-200 transition">Switch Role / Login</button>
                </header>

                <div class="bg-indigo-900/60 border border-indigo-800 p-6 rounded-2xl space-y-6">
                    <div>
                        <h2 class="text-base font-bold text-white">🛡️ Admin Job Posting Studio</h2>
                        <p class="text-xs text-indigo-300 mt-1">Create and publish shift opportunities with precise timing, locations, and pricing.</p>
                    </div>

                    <!-- Job Posting Form -->
                    <div class="bg-indigo-950 p-5 rounded-xl border border-indigo-800 space-y-4">
                        <h3 class="font-bold text-slate-200 text-sm">Post New Shift / Job</h3>
                        <form onsubmit="handlePostJob(event)" class="space-y-3">
                            <div>
                                <label class="block text-[10px] text-indigo-300 uppercase font-semibold mb-1">Job Title</label>
                                <input type="text" id="admin-job-title" required placeholder="e.g. Warehouse Inventory Supervisor" class="w-full bg-indigo-900 border border-indigo-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[10px] text-indigo-300 uppercase font-semibold mb-1">Location / Venue</label>
                                    <input type="text" id="admin-job-location" required placeholder="e.g. Indiranagar Hub, Sector 4" class="w-full bg-indigo-900 border border-indigo-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-indigo-300 uppercase font-semibold mb-1">Payout / Price</label>
                                    <input type="text" id="admin-job-price" required placeholder="e.g. ₹1500" class="w-full bg-indigo-900 border border-indigo-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[10px] text-indigo-300 uppercase font-semibold mb-1">Shift Time & Schedule</label>
                                <input type="text" id="admin-job-time" required placeholder="e.g. Tomorrow, 09:00 AM - 05:00 PM (8 Hours)" class="w-full bg-indigo-900 border border-indigo-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                            </div>
                            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white p-3 rounded-lg shadow transition cursor-pointer">Publish Job Listing</button>
                        </form>
                    </div>

                    <!-- Active Posted Jobs List -->
                    <div class="bg-indigo-950 p-5 rounded-xl border border-indigo-800 space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-slate-200 text-sm">Active Posted Listings</h3>
                            <button onclick="clearAllJobs()" class="text-[10px] bg-rose-600/80 hover:bg-rose-600 px-2.5 py-1 rounded font-bold text-white transition">Clear All Jobs</button>
                        </div>
                        <div id="admin-job-list" class="space-y-2">
                            <p class="text-xs text-slate-400 italic">No jobs posted yet.</p>
                        </div>
                    </div>
                </div>
            `;
            renderAdminJobList();
        }

        function handlePostJob(event) {
            event.preventDefault();
            const title = document.getElementById('admin-job-title').value;
            const location = document.getElementById('admin-job-location').value;
            const price = document.getElementById('admin-job-price').value;
            const time = document.getElementById('admin-job-time').value;

            const newJob = {
                id: Date.now(),
                title,
                location,
                price,
                time,
                postedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            let jobs = JSON.parse(localStorage.getItem('vitapa_posted_jobs') || '[]');
            jobs.unshift(newJob);
            localStorage.setItem('vitapa_posted_jobs', JSON.stringify(jobs));

            alert('Job posted successfully!');
            document.getElementById('admin-job-title').value = '';
            document.getElementById('admin-job-location').value = '';
            document.getElementById('admin-job-price').value = '';
            document.getElementById('admin-job-time').value = '';
            renderAdminJobList();
        }

        function renderAdminJobList() {
            const listEl = document.getElementById('admin-job-list');
            if (!listEl) return;
            const jobs = JSON.parse(localStorage.getItem('vitapa_posted_jobs') || '[]');
            
            if (jobs.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-slate-400 italic">No jobs posted yet.</p>';
                return;
            }

            listEl.innerHTML = '';
            jobs.forEach(job => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-indigo-900/40 border border-indigo-800 rounded-lg flex justify-between items-center text-xs';
                item.innerHTML = `
                    <div>
                        <strong class="text-slate-200">${job.title}</strong><br>
                        <span class="text-[10px] text-indigo-300">📍 ${job.location} | ⏰ ${job.time}</span>
                    </div>
                    <div class="text-right flex items-center gap-3">
                        <span class="font-bold text-emerald-400 text-sm">${job.price}</span>
                        <button onclick="deleteJob(${job.id})" class="text-[10px] bg-rose-600/70 hover:bg-rose-600 px-2 py-1 rounded text-white font-bold">Delete</button>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function deleteJob(id) {
            let jobs = JSON.parse(localStorage.getItem('vitapa_posted_jobs') || '[]');
            jobs = jobs.filter(j => j.id !== id);
            localStorage.setItem('vitapa_posted_jobs', JSON.stringify(jobs));
            renderAdminJobList();
        }

        function clearAllJobs() {
            localStorage.removeItem('vitapa_posted_jobs');
            renderAdminJobList();
        }

        function renderWorkerJobsFeed() {
            const feedEl = document.getElementById('worker-available-jobs');
            if (!feedEl) return;
            const jobs = JSON.parse(localStorage.getItem('vitapa_posted_jobs') || '[]');

            if (jobs.length === 0) {
                feedEl.innerHTML = '<p class="text-xs text-slate-400 italic">No active shift listings posted by admin yet.</p>';
                return;
            }

            feedEl.innerHTML = '';
            jobs.forEach(job => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-indigo-900/40 border border-indigo-800 rounded-lg flex justify-between items-center text-xs';
                item.innerHTML = `
                    <div>
                        <strong class="text-slate-200">${job.title}</strong><br>
                        <span class="text-[10px] text-indigo-300">📍 ${job.location} | ⏰ ${job.time}</span>
                    </div>
                    <div class="text-right">
                        <span class="font-bold text-emerald-400 text-sm block mb-1">${job.price}</span>
                        <span class="bg-indigo-600 text-white px-2 py-0.5 rounded text-[10px] font-bold">Available</span>
                    </div>
                `;
                feedEl.appendChild(item);
            });
        }

        function switchView(view) {
            const isPortal = view === 'portal';
            document.getElementById('portal-view').classList.toggle('hidden', !isPortal);
            document.getElementById('earnings-view').classList.toggle('hidden', isPortal);

            document.getElementById('tab-portal-btn').className = isPortal ? 'text-xs bg-indigo-600 px-3 py-1.5 rounded font-bold shadow' : 'text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded font-bold border border-slate-700';
            document.getElementById('tab-earnings-btn').className = !isPortal ? 'text-xs bg-indigo-600 px-3 py-1.5 rounded font-bold shadow' : 'text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded font-bold border border-slate-700';
            
            if (isPortal) renderWorkerJobsFeed();
        }

        function handleLogout() {
            localStorage.removeItem('vitapa_role');
            window.location.reload();
        }
    </script>
</body>
</html>
